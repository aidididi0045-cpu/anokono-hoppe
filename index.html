<style>
  :root{
    --ink:#4a3640;
    --paper:#f2b9b2;          /* くすみピンク */
    --grid:rgba(255,255,255,.45);
    --pink:#e8577e;           /* メインピンク */
    --pink-deep:#d13a66;
    --teal:#3fbfa8;           /* レトロな緑 */
    --teal-deep:#2a9a86;
    --sun:#f5c944;            /* からし色イエロー */
    --cream:#fff6ee;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    font-family:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;flex-direction:column;
    touch-action:none;
    /* 白い方眼グリッド */
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:44px 44px;
    position:relative;
  }
  /* (画面端の装飾は削除) */
  header{
    padding:18px 18px 8px;
    text-align:center;
    position:relative;z-index:1;
  }
  .brand{
    font-family:"Darumadrop One",monospace;
    font-size:13px;
    letter-spacing:.35em;
    color:var(--teal);
    text-transform:uppercase;
    margin-bottom:2px;
  }
  h1{
    font-family:"Darumadrop One","Kiwi Maru",sans-serif;
    font-size:clamp(30px,8vw,46px);
    letter-spacing:.04em;
    color:var(--pink);
    -webkit-text-stroke:1.5px var(--pink-deep);
    text-shadow:3px 3px 0 rgba(255,255,255,.75);
    font-style:italic;
    transform:rotate(-2deg);
    display:inline-block;
  }
  .sub{
    display:block;
    font-size:12px;
    color:var(--ink);
    opacity:.72;
    letter-spacing:.14em;
    margin-top:4px;
  }
  .sub::before{content:'❝ ';color:var(--teal);font-size:14px;}
  .sub::after{content:' ❞';color:var(--teal);font-size:14px;}
  #stage{
    flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    min-height:0;z-index:1;
  }
  canvas{
    max-width:100%;max-height:100%;
    border-radius:6px;
    border:4px solid var(--cream);
    box-shadow:8px 8px 0 rgba(74,54,64,.22);
    touch-action:none;
    display:none;
  }
  canvas.active{display:block;}
  canvas{cursor:grab;}
  canvas.grabbing{cursor:grabbing;}
  #handCursor{
    position:fixed;
    font-size:52px;
    pointer-events:none;
    z-index:50;
    transform:translate(-50%,-50%);
    display:none;
    filter:drop-shadow(0 3px 4px rgba(0,0,0,.2));
  }
  #handCursor.show{display:block;}
  .poyon{
    position:absolute;
    pointer-events:none;
    font-weight:900;
    font-family:"Darumadrop One","Kiwi Maru","Hiragino Maru Gothic ProN",sans-serif;
    color:#fff;
    -webkit-text-stroke:5px var(--pink-deep);
    paint-order:stroke fill;
    text-shadow:
      4px 4px 0 var(--ink),
      0 0 14px rgba(255,255,255,.9);
    animation:poyonComic 1.5s cubic-bezier(.2,1.6,.4,1) forwards;
    z-index:40;
    white-space:nowrap;
    letter-spacing:.02em;
  }
  .poyon::before{
    content:'';
    position:absolute;
    inset:-18px -22px;
    background:
      radial-gradient(circle, transparent 55%, transparent 100%),
      repeating-conic-gradient(from 0deg,
        rgba(245,201,68,.9) 0deg 6deg,
        transparent 6deg 24deg);
    border-radius:50%;
    z-index:-1;
    animation:burstSpin 1.5s ease-out forwards;
    mask:radial-gradient(circle, transparent 40%, #000 45%, #000 70%, transparent 75%);
    -webkit-mask:radial-gradient(circle, transparent 40%, #000 45%, #000 70%, transparent 75%);
  }
  @keyframes poyonComic{
    0%  { opacity:0; transform:translate(-50%,-50%) scale(.2) rotate(-14deg); }
    18% { opacity:1; transform:translate(-50%,-58%) scale(1.35) rotate(6deg); }
    30% { transform:translate(-50%,-56%) scale(.95) rotate(-3deg); }
    42% { transform:translate(-50%,-60%) scale(1.05) rotate(1deg); }
    75% { opacity:1; transform:translate(-50%,-62%) scale(1) rotate(0deg); }
    100%{ opacity:0; transform:translate(-50%,-85%) scale(1) rotate(0deg); }
  }
  @keyframes burstSpin{
    0%{ opacity:0; transform:scale(.3) rotate(0deg); }
    15%{ opacity:1; }
    60%{ opacity:.6; }
    100%{ opacity:0; transform:scale(1.25) rotate(28deg); }
  }
  /* アップロード前の顔 */
  #dropzone{
    width:min(78vw,340px);aspect-ratio:1;
    border:4px solid var(--cream);
    border-radius:10px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:var(--pink);
    cursor:pointer;
    transition:transform .15s, background .15s;
    text-align:center;padding:20px;
    box-shadow:8px 8px 0 rgba(74,54,64,.22);
    color:#fff;
  }
  #dropzone:hover{transform:scale(1.02) rotate(-1deg);}
  #dropzone.drag{background:var(--teal);}
  .face{font-size:64px;animation:wobble 2.4s ease-in-out infinite;}
  @keyframes wobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) scale(1.05)}}
  #dropzone p{font-size:15px;line-height:1.7;font-weight:900;text-shadow:2px 2px 0 rgba(0,0,0,.12);}
  #dropzone small{font-size:11px;opacity:.85;}
  #file{display:none;}
  footer{
    padding:10px 14px 18px;
    display:flex;gap:10px;justify-content:center;flex-wrap:wrap;
    position:relative;z-index:1;
  }
  button{
    font-family:inherit;font-size:13px;font-weight:900;
    padding:10px 18px;border-radius:6px;border:3px solid var(--ink);
    background:var(--cream);color:var(--ink);cursor:pointer;
    box-shadow:4px 4px 0 var(--ink);
    transition:transform .08s, box-shadow .08s;
    display:none;
    letter-spacing:.04em;
  }
  button.show{display:inline-block;}
  button:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--ink);}
  button.primary{background:var(--pink);color:#fff;}
  #onomatopeBtn{background:var(--sun);}
  #hint{
    position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;font-size:12px;font-weight:900;
    padding:7px 16px;border-radius:6px;pointer-events:none;
    opacity:0;transition:opacity .4s;white-space:nowrap;
    box-shadow:3px 3px 0 rgba(0,0,0,.18);
  }
  #hint.show{opacity:1;}
</style>
</head>
<body>
<header>
  <div class="brand">MUNI MUNI PROJECT</div>
  <h1>あのこのほっぺ</h1>
  <span class="sub">引っ張って、離して、ぷるんっ</span>
</header>

<div id="stage">
  <div id="dropzone">
    <div class="face">😊</div>
    <p>ここをタップして<br>写真をえらんでね</p>
    <small>（写真はどこにも送信されません）</small>
  </div>
  <canvas id="cv"></canvas>
  <div id="hint">ほっぺをドラッグして引っ張ってみて！</div>
</div>
<div id="handCursor" style="display:none">🤏</div>

<footer>
  <button id="resetBtn">🔄 べつの写真</button>
  <button id="onomatopeBtn">💬 オノマトペ ON</button>
</footer>

<input type="file" id="file" accept="image/*">

<script>
(() => {
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const dz = document.getElementById('dropzone');
const fileInput = document.getElementById('file');
const hint = document.getElementById('hint');
const resetBtn = document.getElementById('resetBtn');

// メッシュ設定(スマホは負荷を抑えるため粗めに)
const IS_MOBILE = (typeof matchMedia !== 'undefined' && matchMedia('(pointer: coarse)').matches);
const GRID = IS_MOBILE ? 28 : 48; // 分割数(片辺)
let img = null;
let cols, rows, cellW, cellH;
let pts = [];                 // {x,y,ox,oy,vx,vy}
const STIFF = 0.12;           // バネの強さ(元に戻る力)
const DAMP  = 0.86;           // 減衰(控えめなぷるぷる)
let grab = null;              // {idx:[...], weights:[...], px, py}
let redness = 0;              // 0〜1、引っ張りすぎ度
let lastGrabX = 0, lastGrabY = 0;
const handCursor = document.getElementById('handCursor');

// ===== 効果音(WebAudioで合成、外部ファイル不要) =====
let actx = null;
function ensureAudio(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function playTone(freqStart, freqEnd, dur, type='sine', vol=0.18){
  try{
    const ac = ensureAudio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freqStart, ac.currentTime);
    osc.frequency.exponentialRampToValueAtTime(Math.max(freqEnd,1), ac.currentTime + dur);
    gain.gain.setValueAtTime(vol, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    osc.connect(gain); gain.connect(ac.destination);
    osc.start(); osc.stop(ac.currentTime + dur);
  }catch(e){ /* 音が出せない環境は無視 */ }
}
function sfxGrab(){ playTone(320, 260, 0.09, 'sine', 0.14); }
function sfxPoke(){ playTone(620, 480, 0.08, 'sine', 0.16); }
function sfxRelease(strength){
  // 引っ張り具合で音程・長さが変わる「ぽよん」
  const base = 500 - Math.min(strength,1)*180;
  playTone(base, base*0.55, 0.28 + Math.min(strength,1)*0.15, 'sine', 0.2);
}

function vibrate(ms){
  if(navigator.vibrate){ try{ navigator.vibrate(ms); }catch(e){} }
}

let onomatopeOn = true;
const onomatopeBtn = document.getElementById('onomatopeBtn');
onomatopeBtn.addEventListener('click', () => {
  onomatopeOn = !onomatopeOn;
  onomatopeBtn.textContent = onomatopeOn ? '💬 オノマトペ ON' : '💬 オノマトペ OFF';
  onomatopeBtn.style.opacity = onomatopeOn ? '1' : '.55';
});

function popPoyon(x, y, text, strength = 0.3){
  if(!onomatopeOn) return;
  const stage = document.getElementById('stage');
  const rect = cv.getBoundingClientRect();
  const el = document.createElement('div');
  el.className = 'poyon';
  el.textContent = text;
  // 強く・長く引っ張るほどデカ文字
  const size = 16 + strength * 30;
  el.style.fontSize = size + 'px';
  el.style.setProperty('--tilt', (Math.random()*16 - 8) + 'deg');
  el.style.left = (rect.left - stage.getBoundingClientRect().left + x * rect.width/cv.width) + 'px';
  el.style.top  = (rect.top  - stage.getBoundingClientRect().top  + y * rect.height/cv.height) + 'px';
  stage.appendChild(el);
  setTimeout(()=>el.remove(), 1520);
}

function loadFile(f){
  if(!f || !f.type.startsWith('image/')) return;
  const url = URL.createObjectURL(f);
  const im = new Image();
  im.onload = () => { URL.revokeObjectURL(url); setup(im); };
  im.src = url;
}

dz.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => loadFile(e.target.files[0]));
dz.addEventListener('dragover', e => {e.preventDefault(); dz.classList.add('drag');});
dz.addEventListener('dragleave', () => dz.classList.remove('drag'));
dz.addEventListener('drop', e => {e.preventDefault(); dz.classList.remove('drag'); loadFile(e.dataTransfer.files[0]);});

resetBtn.addEventListener('click', () => fileInput.click());

// ★ 画像表示中でも、画面のどこにドロップしても差し替えできる
window.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag'); });
window.addEventListener('dragleave', e => { if(!e.relatedTarget) dz.classList.remove('drag'); });
window.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag');
  if(e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

function setup(image){
  img = image;
  // ステージに収まるサイズ
  const stage = document.getElementById('stage');
  const maxW = stage.clientWidth - 24, maxH = stage.clientHeight - 24;
  const cssScale = Math.min(maxW/img.width, maxH/img.height, 1.5);
  // ★ スマホは内部解像度を上限640pxに(表示サイズはそのまま、描画負荷だけ減る)
  let resScale = cssScale;
  if(IS_MOBILE){
    resScale = Math.min(cssScale, 640 / Math.max(img.width, img.height));
  }
  cv.width  = Math.round(img.width * resScale);
  cv.height = Math.round(img.height * resScale);
  cv.style.width  = Math.round(img.width * cssScale) + 'px';
  cv.style.height = Math.round(img.height * cssScale) + 'px';

  cols = GRID; rows = Math.max(8, Math.round(GRID * cv.height / cv.width));
  cellW = cv.width / cols; cellH = cv.height / rows;
  pts = [];
  for(let r=0; r<=rows; r++){
    for(let c=0; c<=cols; c++){
      const x = c*cellW, y = r*cellH;
      pts.push({x, y, ox:x, oy:y, vx:0, vy:0});
    }
  }
  redness = 0;
  dz.style.display = 'none';
  cv.classList.add('active');
  resetBtn.classList.add('show');
  onomatopeBtn.classList.add('show');
  hint.classList.add('show');
  setTimeout(()=>hint.classList.remove('show'), 3500);
}

function idx(c,r){ return r*(cols+1)+c; }

// つかむ:ポインタ近傍の点を重み付きで
function startGrab(px, py){
  const RADIUS = Math.min(cv.width, cv.height) * 0.22;
  const grabbed = [], weights = [];
  for(let i=0;i<pts.length;i++){
    const p = pts[i];
    const d = Math.hypot(p.x-px, p.y-py);
    if(d < RADIUS){
      grabbed.push(i);
      // コサインカーブで中心から縁までなめらかに減衰(角が立たない)
      const t = d / RADIUS;
      weights.push(0.5 * (1 + Math.cos(Math.PI * t)));
    }
  }
  if(grabbed.length){
    grab = {idx:grabbed, weights, px, py, sx:px, sy:py, maxStretch:0, t0:performance.now()};
    lastGrabX = px; lastGrabY = py;
    sfxGrab();
    vibrate(15);
    cv.classList.add('grabbing');
  }
}
function moveGrab(px, py){
  if(!grab) return;
  // ★ 点は直接動かさない。指の位置(=引っ張り目標)だけ更新する
  //    実際の移動はphysics()のバネが行う → 離した瞬間に必ずぷるんと戻る
  const MAXPULL = Math.min(cv.width, cv.height) * 0.065;
  let dx = px - grab.sx, dy = py - grab.sy;
  const dist = Math.hypot(dx, dy);
  // ソフトリミット:限界を超えた分はじわ〜っとしか伸びない
  if(dist > MAXPULL){
    const over = dist - MAXPULL;
    const soft = MAXPULL + Math.log1p(over * 0.06) * 10;
    const s = soft / dist;
    dx *= s; dy *= s;
  }
  grab.px = grab.sx + dx; grab.py = grab.sy + dy;

  const norm = Math.min(dist / MAXPULL, 1);
  grab.maxStretch = Math.max(grab.maxStretch, norm);
  if(norm > 0.9 && !grab.buzzed){ grab.buzzed = true; vibrate(20); }
}
// ★ ツンツン:タップ位置周辺を一瞬押し込んで、バネでプルプルさせる
function poke(px, py){
  const RADIUS = Math.min(cv.width, cv.height) * 0.20;
  const PUSH = Math.min(cv.width, cv.height) * 0.05;
  for(const p of pts){
    const d = Math.hypot(p.ox - px, p.oy - py);
    if(d < RADIUS){
      const w = Math.pow(1 - d/RADIUS, 2);
      // 押し込み方向:タップ点から外側へふにっと逃げる
      const ang = Math.atan2(p.oy - py, p.ox - px) || Math.random()*Math.PI*2;
      p.vx += Math.cos(ang) * PUSH * w * 0.9;
      p.vy += Math.sin(ang) * PUSH * w * 0.9;
    }
  }
  lastGrabX = px; lastGrabY = py;
  redness = Math.max(redness, 0.25);
  sfxPoke();
  vibrate([18, 35, 12]);  // ぷにっ(短→間→短の2連パルス)
  popPoyon(px, py, pick(['ぷにっ','つんっ','ぷるっ']));
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function endGrab(){
  if(grab){
    const heldMs = performance.now() - grab.t0;
    const moved = Math.hypot(grab.px - grab.sx, grab.py - grab.sy);
    if(heldMs < 250 && moved < 8){
      // ★ ほぼ動かさず短く触った → ツンツン扱い
      const tx = grab.sx, ty = grab.sy;
      grab = null;
      cv.classList.remove('grabbing');
      poke(tx, ty);
      return;
    }
    sfxRelease(grab.maxStretch || 0);
    // ぽよんっ(強く引っ張るほどしっかり震える)
    vibrate(grab.maxStretch > 0.6 ? [15, 30, 25, 30, 10] : [12, 25, 8]);
    let cx=0, cy=0;
    grab.idx.forEach(i => { cx += pts[i].x; cy += pts[i].y; });
    cx /= grab.idx.length; cy /= grab.idx.length;
    // ★ 引っ張りの強さ + 保持時間 で迫力が決まる
    const heldSec = Math.min((performance.now() - grab.t0) / 1000, 5);
    const power = Math.min(grab.maxStretch * 0.7 + heldSec * 0.18, 1.4);
    const word = power > 0.9 ? pick(['ぷにょ〜〜ん！！','びよぉ〜ん！！','むにょ〜ん！！'])
               : power > 0.45 ? pick(['ぷにーん！','むにーん！','びよん！'])
               : pick(['ぽよん','ぷるん','むにっ']);
    popPoyon(cx, cy, word, power);
  }
  grab = null;
  cv.classList.remove('grabbing');
}

function getPos(e){
  const r = cv.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return [ (t.clientX - r.left) * cv.width / r.width,
           (t.clientY - r.top ) * cv.height / r.height ];
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  cv.setPointerCapture(e.pointerId);
  startGrab(...getPos(e));
});
cv.addEventListener('pointermove', e => moveGrab(...getPos(e)));
// ★ 離す系イベントを全部拾って「手が離れない」状態を防ぐ
function releaseAll(e){
  if(e && e.pointerId !== undefined){
    try{ cv.releasePointerCapture(e.pointerId); }catch(_){}
  }
  endGrab();
}
cv.addEventListener('pointerup', releaseAll);
cv.addEventListener('pointercancel', releaseAll);
cv.addEventListener('lostpointercapture', releaseAll);
window.addEventListener('pointerup', releaseAll);
window.addEventListener('pointercancel', releaseAll);
window.addEventListener('blur', () => endGrab());
document.addEventListener('visibilitychange', () => { if(document.hidden) endGrab(); });

// 物理:全ての点が常にバネで動く
//  掴み中 … 目標 = 元位置 + (指の引っ張りベクトル × 重み)
//  離した後 … 目標 = 元位置  → 勢いが残ったままなので必ずぷるんと弾む
function physics(){
  const pullX = grab ? grab.px - grab.sx : 0;
  const pullY = grab ? grab.py - grab.sy : 0;
  const weightMap = grab ? new Map(grab.idx.map((v,k)=>[v, grab.weights[k]])) : null;
  const GRAB_STIFF = 0.42; // 指への追従はキビキビ

  for(let i=0;i<pts.length;i++){
    const p = pts[i];
    const w = weightMap ? (weightMap.get(i) || 0) : 0;
    // 目標位置
    const tx = p.ox + pullX * w;
    const ty = p.oy + pullY * w;
    const stiff = w > 0 ? STIFF + (GRAB_STIFF - STIFF) * w : STIFF;
    p.vx += (tx - p.x) * stiff;
    p.vy += (ty - p.y) * stiff;
    p.vx *= DAMP; p.vy *= DAMP;
    p.x += p.vx; p.y += p.vy;
  }

  // ★ 引っ張っている間、時間とともに赤みがじわじわ濃くなる
  if(grab){
    const stretch = grab.maxStretch || 0;
    if(stretch > 0.12){
      const heldSec = (performance.now() - grab.t0) / 1000;
      // 引っ張りの強さ×保持時間で蓄積(最大1)
      const target = Math.min(0.25 + stretch * 0.35 + heldSec * 0.18, 1);
      redness = Math.min(Math.max(redness, redness + 0.012), target);
      lastGrabX = grab.sx; lastGrabY = grab.sy;  // ★ 根本(掴み始めた位置)が赤くなる
    }
  } else {
    redness *= 0.985; // 離すとじわ〜っと元の色に戻る
    if(redness < 0.01) redness = 0;
  }

  // ★ 隣接点の距離拘束(極端な破綻だけ防ぐ・揺れは妨げない)
  constrain(null);
}
function constrain(grabbedSet){
  const maxW = cellW * 1.7, maxH = cellH * 1.7;   // これ以上は伸ばさない
  const minW = cellW * 0.3, minH = cellH * 0.3;   // これ以上は潰さない
  for(let r=0;r<=rows;r++){
    for(let c=0;c<=cols;c++){
      const i = idx(c,r);
      if(c < cols) relax(i, idx(c+1,r), cellW, minW, maxW, grabbedSet);
      if(r < rows) relax(i, idx(c,r+1), cellH, minH, maxH, grabbedSet);
    }
  }
}
function relax(i, j, rest, minD, maxD, grabbedSet){
  const a = pts[i], b = pts[j];
  let dx = b.x - a.x, dy = b.y - a.y;
  let d = Math.hypot(dx, dy) || 0.0001;
  let target = null;
  if(d > maxD) target = maxD;
  else if(d < minD) target = minD;
  if(target === null) return;
  const diff = (d - target) / d * 0.5;
  const aFixed = grabbedSet && grabbedSet.has(i);
  const bFixed = grabbedSet && grabbedSet.has(j);
  if(aFixed && bFixed) return;
  if(aFixed){ b.x -= dx*diff*2; b.y -= dy*diff*2; }
  else if(bFixed){ a.x += dx*diff*2; a.y += dy*diff*2; }
  else { a.x += dx*diff; a.y += dy*diff; b.x -= dx*diff; b.y -= dy*diff; }
}

function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  // ★ ベースは元画像を1回描くだけ(超軽量)
  ctx.drawImage(img, 0, 0, img.width, img.height, 0, 0, cv.width, cv.height);

  // ★ 変形しているセルだけ三角形で上描きする(ダーティセル方式)
  //    静止時は三角形ゼロ、引っ張り中も動いている領域だけなので劇的に軽い
  const EPS = 0.15; // これ以下の変位は「静止」とみなす
  const moved = new Uint8Array(pts.length);
  for(let i=0;i<pts.length;i++){
    const p = pts[i];
    if(Math.abs(p.x - p.ox) > EPS || Math.abs(p.y - p.oy) > EPS) moved[i] = 1;
  }
  const sw = img.width / cols, sh = img.height / rows;
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      const i00 = idx(c,r), i10 = idx(c+1,r), i01 = idx(c,r+1), i11 = idx(c+1,r+1);
      if(!(moved[i00] || moved[i10] || moved[i01] || moved[i11])) continue; // 全点静止→ベース画像のままでOK
      const p00 = pts[i00], p10 = pts[i10], p01 = pts[i01], p11 = pts[i11];
      drawTri(p00,p10,p01, c*sw,r*sh, (c+1)*sw,r*sh, c*sw,(r+1)*sh);
      drawTri(p11,p01,p10, (c+1)*sw,(r+1)*sh, c*sw,(r+1)*sh, (c+1)*sw,r*sh);
    }
  }
  if(redness > 0.02) drawRedness();
}
function drawRedness(){
  const r = Math.min(cv.width, cv.height) * 0.28;
  const g = ctx.createRadialGradient(lastGrabX, lastGrabY, 0, lastGrabX, lastGrabY, r);
  g.addColorStop(0, `rgba(255,90,120,${0.32 * redness})`);
  g.addColorStop(0.6, `rgba(255,120,140,${0.16 * redness})`);
  g.addColorStop(1, 'rgba(255,120,140,0)');
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(lastGrabX, lastGrabY, r, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}
// アフィン変換でテクスチャ三角形を描画(わずかに膨らませて継ぎ目を消す)
function drawTri(p0,p1,p2, u0,v0,u1,v1,u2,v2){
  // 重心方向に0.6px膨張
  const gx = (p0.x+p1.x+p2.x)/3, gy = (p0.y+p1.y+p2.y)/3;
  const E = 0.6;
  const inflate = p => {
    const dx = p.x-gx, dy = p.y-gy;
    const l = Math.hypot(dx,dy) || 1;
    return {x: p.x + dx/l*E, y: p.y + dy/l*E};
  };
  const q0 = inflate(p0), q1 = inflate(p1), q2 = inflate(p2);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(q0.x,q0.y); ctx.lineTo(q1.x,q1.y); ctx.lineTo(q2.x,q2.y);
  ctx.closePath();
  ctx.clip();
  const d = u0*(v1-v2) + u1*(v2-v0) + u2*(v0-v1);
  if(Math.abs(d) < 1e-6){ ctx.restore(); return; }
  const a = (p0.x*(v1-v2) + p1.x*(v2-v0) + p2.x*(v0-v1)) / d;
  const b = (p0.x*(u2-u1) + p1.x*(u0-u2) + p2.x*(u1-u0)) / d;
  const c = (p0.y*(v1-v2) + p1.y*(v2-v0) + p2.y*(v0-v1)) / d;
  const dd= (p0.y*(u2-u1) + p1.y*(u0-u2) + p2.y*(u1-u0)) / d;
  const e = p0.x - a*u0 - b*v0;
  const f = p0.y - c*u0 - dd*v0;
  ctx.transform(a,c,b,dd,e,f);
  ctx.drawImage(img, 0,0);
  ctx.restore();
}

function loop(){
  if(img){ physics(); draw(); }
  requestAnimationFrame(loop);
}
loop();

window.addEventListener('resize', () => { if(img) setup(img); });
})();
</script>
</body>
</html>
